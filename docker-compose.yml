version: '3.8'

services:
  # Real Freelance Jobs Bot & Webhook/API Service
  bot:
    build: .
    container_name: real_freelance_jobs_bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory for persistent SQLite database
      - sqlite_data:/app/data
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/freelance_jobs.db
      - FASTAPI_HOST=0.0.0.0
      - FASTAPI_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # Optional PostgreSQL service for production scale
  postgres:
    image: postgres:16-alpine
    container_name: real_freelance_jobs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: freelance_jobs
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - with-postgres

volumes:
  sqlite_data:
  pg_data:
